<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safety Lab Aero — Sign in</title>
<style>
  :root{
    --navy:#0A1F44; --blue:#007aff; --purple:#af52de; --ink:#1b1f27; --mut:#5b6270;
    --bg:#f6f8fc; --card:#fff; --line:#e4e8f1; --good:#1a7f37; --bad:#c0362c;
    --grad:linear-gradient(135deg,#007aff,#af52de);
    --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(10,31,68,.10);overflow:hidden}
  .top{background:var(--navy);color:#fff;padding:22px 24px;text-align:center}
  .mark{width:42px;height:42px;border-radius:11px;background:var(--grad);display:inline-flex;align-items:center;justify-content:center;margin-bottom:10px}
  .mark svg{width:24px;height:24px}
  .top h1{font-size:18px;margin:0}
  .top .who{font-size:13px;color:#9fb0cc;margin-top:3px}
  .body{padding:20px 24px 24px}
  .lic{font-size:12.5px;border-radius:9px;padding:9px 11px;margin-bottom:16px}
  .lic.ok{background:#e8f7ec;color:var(--good);border:1px solid #bfe3c8}
  .lic.bad{background:#fdecea;color:var(--bad);border:1px solid #f3c9c4}
  label span{display:block;font-size:12.5px;font-weight:600;margin:0 0 4px}
  input[type=password]{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:13px}
  .err{color:var(--bad);font-size:12px;margin-top:8px;display:none}
  .err.show{display:block}
  .btns{display:flex;gap:10px;margin-top:18px}
  button{flex:1;font:inherit;font-size:13px;font-weight:600;border-radius:9px;padding:10px 16px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink)}
  button.primary{border:none;color:#fff;background:var(--grad)}
  .quit{flex:none;background:#fff}
</style>
</head>
<body>
  <div class="card">
    <div class="top">
      <span class="mark"><svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><polygon points="32,16 48,48 16,48" fill="#fff"/></svg></span>
      <h1>Welcome back</h1>
      <div class="who" id="who">Safety Lab Aero</div>
    </div>
    <div class="body">
      <div class="lic ok" id="lic">Checking license…</div>
      <label id="passwrap" style="display:none"><span>Passcode</span><input id="pass" type="password" autocomplete="off" autofocus></label>
      <div class="err" id="err"></div>
      <div class="btns">
        <button class="quit" id="quit" type="button">Quit</button>
        <button class="primary" id="go" type="button">Sign in</button>
      </div>
    </div>
  </div>
<script>
  const $ = id => document.getElementById(id);
  let mode = 'signin'; // or 'reactivate'

  function showErr(m){ const e=$('err'); e.textContent=m||''; e.className='err'+(m?' show':''); }

  async function init(){
    let b; try{ b = await window.gate.getBootstrap(); }catch(e){ return; }
    const prof = b.existing && b.existing.profile;
    $('who').textContent = prof ? (prof.name || prof.email || 'Safety Lab Aero') + (prof.org ? ' · ' + prof.org : '') : 'Safety Lab Aero';
    const li = b.existing && b.existing.licenseInfo;
    if (!li || li.expired){
      mode='reactivate';
      $('lic').className='lic bad';
      $('lic').textContent = li && li.expired ? ('License expired'+(li.exp?(' on '+new Date(li.exp*1000).toISOString().slice(0,10)):'')+'. Enter a new key to continue.') : 'No valid license found on this machine.';
      $('passwrap').style.display='none';
      $('go').textContent='Re-activate';
    } else {
      $('lic').className='lic ok';
      $('lic').textContent = 'Licensed'+(li.org?(' to '+li.org):'')+' · '+li.tier+' · '+(li.exp?('expires '+new Date(li.exp*1000).toISOString().slice(0,10)):'perpetual');
      $('passwrap').style.display = (b.existing && b.existing.hasPasscode) ? 'block' : 'none';
      $('go').textContent='Sign in';
      const p=$('pass'); if(p && $('passwrap').style.display==='block') p.focus();
    }
  }

  async function go(){
    if (mode==='reactivate'){ window.gate.reactivate(); return; }
    showErr('');
    $('go').disabled=true;
    let r; try{ r = await window.gate.signin({ passcode: $('pass').value || '' }); }catch(e){ r={ok:false,error:String(e)}; }
    if (r && r.ok) return; // main opens the app + closes this window
    $('go').disabled=false;
    if (r && r.relock){ mode='reactivate'; $('go').textContent='Re-activate'; $('lic').className='lic bad'; $('lic').textContent=r.error||'License invalid.'; $('passwrap').style.display='none'; return; }
    showErr((r&&r.error)||'Could not sign in.');
    const p=$('pass'); if(p){ p.value=''; p.focus(); }
  }

  $('go').onclick = go;
  $('quit').onclick = ()=> window.gate.quit();
  $('pass').addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
  init();
</script>
</body>
</html>
