<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safety Lab Aero</title>
<style>
  :root{
    --navy:#0A1F44; --blue:#007aff; --purple:#af52de; --ink:#1b1f27; --mut:#5b6270;
    --bg:#f6f8fc; --card:#fff; --line:#e4e8f1; --good:#1a7f37; --bad:#c0362c;
    --grad:linear-gradient(135deg,#007aff,#af52de);
    --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;display:flex;flex-direction:column}
  header{background:var(--navy);color:#fff;padding:16px 24px;display:flex;align-items:center;gap:12px}
  .mark{width:30px;height:30px;border-radius:8px;background:var(--grad);display:flex;align-items:center;justify-content:center}
  .mark svg{width:17px;height:17px}
  .brand{font-weight:700;font-size:16px}
  .steps{margin-left:auto;display:flex;gap:8px}
  .step{font-size:12px;color:#9fb0cc;padding:5px 11px;border-radius:20px;border:1px solid #24365c;white-space:nowrap}
  .step.active{color:#fff;background:var(--grad);border-color:transparent}
  .step.done{color:#bfe3c8;border-color:#2f5d3f}
  main{flex:1;overflow:auto;padding:24px;max-width:760px;width:100%;margin:0 auto}
  h1{font-size:20px;color:var(--navy);margin:0 0 4px}
  .sub{color:var(--mut);font-size:13px;margin:0 0 18px}
  label.fld{display:block;margin:0 0 12px}
  label.fld span{display:block;font-size:12.5px;font-weight:600;margin:0 0 4px}
  input[type=text],input[type=url],input[type=password],textarea,select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:13px;background:#fff;color:var(--ink)}
  textarea{resize:vertical;min-height:88px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
  .row2{display:flex;gap:12px}.row2>*{flex:1}
  .btnrow{display:flex;gap:10px;align-items:center;margin-top:6px}
  button{font:inherit;font-size:13px;font-weight:600;border-radius:9px;padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink)}
  button.primary{border:none;color:#fff;background:var(--grad)}
  button.primary:disabled{opacity:.45;cursor:not-allowed}
  .status{margin-top:10px;font-size:12.5px;padding:9px 11px;border-radius:8px;display:none}
  .status.ok{display:block;background:#e8f7ec;color:var(--good);border:1px solid #bfe3c8}
  .status.err{display:block;background:#fdecea;color:var(--bad);border:1px solid #f3c9c4}
  .status.info{display:block;background:#eef3ff;color:#3257a8;border:1px solid #d4e0fb}
  .agree-box{height:330px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:#fff;font-size:12.5px;line-height:1.55;color:#2a2f3a}
  .agree-box h4{margin:16px 0 4px;font-size:13px;color:var(--navy)}
  .agree-box p{margin:0 0 8px}
  .meta{font-size:11.5px;color:var(--mut);margin:6px 0 10px}
  .chk{display:flex;gap:9px;align-items:flex-start;margin-top:12px;font-size:13px;cursor:pointer}
  .chk input{margin-top:2px;width:16px;height:16px;flex:none}
  .hint{font-size:11.5px;color:var(--mut);margin-top:3px}
  footer{border-top:1px solid var(--line);background:#fff;padding:14px 24px;display:flex;align-items:center;gap:10px}
  footer .spacer{flex:1}
  fieldset{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:14px 16px;margin:0 0 14px}
  legend{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);padding:0 6px}
  .modes{display:flex;flex-direction:column;gap:8px}
  .mode{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:9px;cursor:pointer}
  .mode.active{border-color:var(--blue);box-shadow:0 0 0 2px rgba(0,122,255,.12)}
  .mode input{margin-top:2px}
  .mode b{font-size:13px;color:var(--navy)}
  .mode small{display:block;color:var(--mut);font-size:11.5px;margin-top:1px}
  .hidden{display:none}
  .lic-card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff;font-size:13px}
  .lic-card b{color:var(--navy)}

</style>
</head>
<body>
  <header><span class="mark"><svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><polygon points="32,16 48,48 16,48" fill="#fff"/></svg></span><span class="brand">Safety Lab Aero</span></header>
  <main style="max-width:440px">
    <h1 id="title">Welcome back</h1>
    <p class="sub" id="lic">Checking license…</p>
    <label class="fld" id="passwrap" style="display:none"><span>Passcode</span><input id="pass" type="password" autocomplete="off" autofocus></label>
    <div class="status" id="err"></div>
  </main>
  <footer>
    <button id="quit" type="button">Quit</button>
    <div class="spacer"></div>
    <button class="primary" id="go" type="button">Unlock</button>
  </footer>
<script>
  const $ = (id) => document.getElementById(id);
  let mode = 'unlock';
  function showErr(m) { const e = $('err'); e.textContent = m || ''; e.className = 'status' + (m ? ' err' : ''); }
  async function init() {
    let b; try { b = await window.gate.getBootstrap(); } catch (e) { return; }
    const lic = b.existing && b.existing.license;
    if (lic && lic.valid) {
      $('lic').textContent = (lic.customer || 'Licensed') + ' · ' + (lic.tier || '') + (lic.trial ? ' · Trial · ' + lic.daysLeft + ' days left' : ' · until ' + String(lic.expiresAt || '').slice(0, 10));
    } else {
      mode = 'reactivate'; $('title').textContent = 'License needed';
      $('lic').textContent = (lic && lic.plain) || 'No valid license on this computer.';
      $('go').textContent = 'Load a license…';
    }
    if (mode === 'unlock' && b.existing.hasPasscode) { $('passwrap').style.display = 'block'; setTimeout(() => $('pass').focus(), 50); }
  }
  async function go() {
    if (mode === 'reactivate') { window.gate.reactivate(); return; }
    $('go').disabled = true; showErr('');
    let r; try { r = await window.gate.unlock({ passcode: $('pass').value || '' }); } catch (e) { r = { ok: false, error: String(e) }; }
    if (!r || !r.ok) { $('go').disabled = false; if (r && r.relock) { mode = 'reactivate'; $('title').textContent = 'License needed'; $('lic').textContent = r.error || ''; $('go').textContent = 'Load a license…'; $('passwrap').style.display = 'none'; } else showErr((r && r.error) || 'Could not unlock.'); }
  }
  $('go').onclick = go;
  $('pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
  $('quit').onclick = () => window.gate.quit();
  init();
</script>
</body>
</html>
